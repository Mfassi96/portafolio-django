
{% load static %}
<!doctype html>
<html lang="es">
<head>
<!-- Required meta tags -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
<title>Portafolio Mauro Fassi</title>
<style>
    body.dark-mode {
        background-color: #1a1a2e !important;
        color: #e0e0e0 !important;
    }
    .dark-mode .navbar {
        background-color: #16213e !important;
        border-color: #0f3460 !important;
    }
    .dark-mode .navbar-brand,
    .dark-mode .nav-link {
        color: #e0e0e0 !important;
    }
    .dark-mode .card {
        background-color: #16213e !important;
        border-color: #0f3460 !important;
    }
    .dark-mode .card-text,
    .dark-mode .text-muted {
        color: #b0b0b0 !important;
    }
    .dark-mode .badge.bg-dark {
        background-color: #0f3460 !important;
    }
    .dark-mode .navbar-toggler {
        border-color: #e0e0e0 !important;
    }
    .dark-mode .navbar-toggler-icon {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28224, 224, 224, 0.8%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e") !important;
    }
    .dark-mode .border-top {
        border-color: #0f3460 !important;
    }
    .btn-theme-toggle {
        border: none;
        background: transparent;
        font-size: 1.3rem;
        cursor: pointer;
        padding: 0.25rem 0.5rem;
    }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3" style="position: fixed; top: 0; width: 100%; z-index: 1000;">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4 d-flex align-items-center" href="{% url 'home' %}">
            <span class="bg-danger rounded-circle d-inline-block me-2" style="width: 12px; height: 12px;"></span>
            Mauro Fassi
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto gap-lg-4">
                <a class="nav-link fw-medium" href="{% url 'home' %}">Inicio</a>
                <a class="nav-link fw-medium" href="{% url 'servicios' %}">Servicios</a>
                <a class="nav-link fw-medium" href="{% url 'project_index' %}">Proyectos</a>
                <a class="nav-link fw-medium" href="{% url 'contacto' %}">Contacto</a>
                <a class="nav-link fw-medium" href="https://github.com/Mfassi96" target="_blank">
                    <i class="fa-brands fa-github fs-5"></i>
                </a>
                <a class="nav-link fw-medium" href="http://www.linkedin.com/in/ma-fa895558" target="_blank">
                    <i class="fa-brands fa-linkedin fs-5"></i>
                </a>
                <button class="btn-theme-toggle nav-link" id="themeToggle" title="Cambiar tema">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </div>
</nav>
<main class="container">
    {% block content %}
    {% endblock %}
</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<script>
    const toggle = document.getElementById('themeToggle');
    const icon = document.getElementById('themeIcon');
    const body = document.body;

    function setTheme(dark) {
        if (dark) {
            body.classList.add('dark-mode');
            icon.classList.replace('fa-moon', 'fa-sun');
            localStorage.setItem('theme', 'dark');
        } else {
            body.classList.remove('dark-mode');
            icon.classList.replace('fa-sun', 'fa-moon');
            localStorage.setItem('theme', 'light');
        }
    }

    const saved = localStorage.getItem('theme');
    if (saved === 'dark') setTheme(true);

    toggle.addEventListener('click', () => {
        setTheme(!body.classList.contains('dark-mode'));
    });
</script>
</body>
</html>
